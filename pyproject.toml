[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phishclf"
version = "0.2.0"
description = "Explainable phishing-email classifier (scikit-learn) with an alert threshold set by false-positive budget"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["scikit-learn>=1.5", "numpy", "scipy", "joblib"]

[project.optional-dependencies]
torch = ["torch>=2.4"]

[project.scripts]
phishclf = "phishclf.cli:main"

[tool.setuptools]
packages = ["phishclf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.bandit]
exclude_dirs = ["tests"]
